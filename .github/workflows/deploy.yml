name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/homework-helper-app-9nqN1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key config
        run: |
          echo "window.MATHBUDDY_KEY = '${{ secrets.ANTHROPIC_API_KEY }}';" > config.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
